// Full-screen camera modal that decodes a barcode from the rear camera using ZXing, then reports
// the decoded text back via onResult. Falls back to explicit device enumeration (picking the rear
// camera by label) on older ZXing builds that don't support decodeFromConstraints.
function CameraScanModal({title,onResult,onClose}){
  const videoRef=useRef(null);
  const [error,setError]=useState("");
  useEffect(()=>{
    let cancelled=false,reader=null,controls=null;
    (async()=>{
      if(!window.ZXing){setError(STR.cameraLoadError);return;}
      try{
        const hints=new Map();
        if(window.ZXing.DecodeHintType)hints.set(window.ZXing.DecodeHintType.TRY_HARDER,true);
        reader=new window.ZXing.BrowserMultiFormatReader(hints);
        const cb=(result)=>{
          if(cancelled||!result)return;
          cancelled=true;
          onResult(sanitizeScanText(result.getText()));
          try{controls&&controls.stop();}catch(e){}
          try{reader.reset();}catch(e){}
        };
        if(typeof reader.decodeFromConstraints==="function"){
          controls=await reader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},videoRef.current,cb);
        }else{
          const devices=await window.ZXing.BrowserMultiFormatReader.listVideoInputDevices();
          const back=devices.find(d=>/back|rear|environment/i.test(d.label))||devices[devices.length-1];
          await reader.decodeFromVideoDevice(back?back.deviceId:undefined,videoRef.current,cb);
        }
      }catch(e){
        if(!cancelled)setError(STR.cameraPermError);
      }
    })();
    return ()=>{
      cancelled=true;
      try{controls&&controls.stop();}catch(e){}
      try{reader&&reader.reset();}catch(e){}
    };
  },[]);
  return <div style={{position:"fixed",inset:0,background:"#000000ee",zIndex:400,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{color:"#fff",fontWeight:700,marginBottom:12,fontSize:15}}>{title}</div>
    {error
      ?<div style={{color:"#fff",textAlign:"center",maxWidth:320,fontSize:13,marginBottom:16}}>{error}</div>
      :<video ref={videoRef} muted playsInline style={{width:"100%",maxWidth:420,borderRadius:8,border:`2px solid ${C.red}`,background:"#000"}}/>}
    <div style={{color:"#aaa",fontSize:12,marginTop:12,marginBottom:16,textAlign:"center"}}>{STR.cameraHold}</div>
    <Btn variant="ghost" onClick={onClose} style={{color:"#fff",borderColor:"#ffffff44"}}>{STR.cameraClose}</Btn>
  </div>;
}

function rowToUser(r){
  if(!r)return null;
  return{id:r.id,type:r.type||"driver",name:r.name||"",license:r.license||"",class:r.class||"",kartNumber:r.kart_number??undefined,club:r.club||"",childIds:r.child_ids||[],parentId:r.parent_id||null,isAdmin:!!r.is_admin,isSubAdmin:!!r.is_sub_admin,isOfficial:!!r.is_official};
}
// CSV-imported drivers and children live in the "imported_users" table (no Supabase Auth account),
// mirrored here from the main app's rowToImportedUser so scan.html can show them too.
function rowToImportedUser(r){
  return {id:r.id,type:r.type||"driver",name:r.name||"",license:r.license||"",class:r.class||"",
    kartNumber:r.kart_number??undefined,club:r.club||"",parentId:r.parent_id||null,isOfficial:!!r.is_official,
    importBatch:r.import_batch||undefined,source:r.source||"imported"};
}
// Registrations live in their own "registrations" table (per event), not in the app_state blob –
// see stripLocal in the main app. Without this, ev.registrations is always empty and no driver
// (imported or not) can be found in scan/heat/profile mode.
function rowToRegistration(r){
  return {userId:r.user_id,class:r.class,paid:!!r.paid,imported:!!r.imported,importBatch:r.import_batch||undefined};
}
function attachRegistrations(events,regRows){
  const byEv={};
  (regRows||[]).forEach(r=>{(byEv[r.event_id]=byEv[r.event_id]||[]).push(rowToRegistration(r));});
  return (events||[]).map(ev=>({...ev,registrations:byEv[ev.id]||[]}));
}
function resolveGroups(ev,cls,session){
  const sg=ev?.sessionGroups||{};
  return sg[`${cls}||${session}`]||sg[`${cls}||*`]||null;
}
function sessionDrivers(ev,cls,session,users,selGroups){
  const regs=(ev?.registrations||[]).filter(r=>!cls||r.class===cls);
  let drivers=regs.map(r=>{const u=users.find(x=>x.id===r.userId);return u?{...u,_regClass:r.class}:null;}).filter(Boolean);
  const groups=resolveGroups(ev,cls,session);
  if(groups&&cls){
    drivers=drivers.filter(d=>d._regClass===cls&&groups[d.kartNumber]!=null).map(d=>({...d,_group:groups[d.kartNumber]}));
    if(selGroups&&selGroups.length)drivers=drivers.filter(d=>selGroups.includes(d._group));
  }
  drivers.sort((a,b)=>(a.kartNumber||99999)-(b.kartNumber||99999));
  return drivers;
}
function sessionGroupLetters(ev,cls,session){
  const groups=resolveGroups(ev,cls,session);
  if(!groups)return [];
  return [...new Set(Object.values(groups))].sort();
}

// Plays a short alarm tone via WebAudio (best-effort; browsers require a user gesture at some
// point in the page before audio is allowed, which scanning already provides via button clicks).
function playAlarm(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25].forEach(delay=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="square";o.frequency.value=880;
      o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(0.15,ctx.currentTime+delay);
      o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+0.18);
    });
  }catch(e){}
}

// ── Root app ─────────────────────────────────────────────────────────────
function App(){
  const [session,setSession]=useState(undefined); // undefined = loading, null = logged out
  const [loaded,setLoaded]=useState(false);
  const [users,setUsers]=useState([]);
  const [events,setEvents]=useState([]);
  const [sessions,setSessions]=useState([]); // heat/session names list
  const [selEvId,setSelEvId]=useState(null);
  const [scans,setScans]=useState([]); // equipment_scans rows for the selected event
  const [mode,setMode]=useState("scan"); // scan | heat | profile

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!session)return;
    (async()=>{
      const [{data:profiles},{data:stateRow},{data:regRows},{data:importedRows}]=await Promise.all([
        sb.from("profiles").select("*"),
        sb.from("app_state").select("data").eq("id",1).maybeSingle(),
        sb.from("registrations").select("*"),
        sb.from("imported_users").select("*"),
      ]);
      const imported=(importedRows||[]).map(rowToImportedUser);
      const merged=[...(profiles||[]).map(rowToUser),...imported];
      setUsers(merged);
      setEvents(attachRegistrations(stateRow?.data?.events||[],regRows||[]));
      setSessions(stateRow?.data?.sessions||[]);
      setLoaded(true);
    })();
  },[session]);

  // Auto-select whichever race is currently chosen in the main app (mirrored to localStorage there),
  // so officials don't have to reselect it here. Only applied once on load — a manual change in the
  // dropdown afterward is never overridden.
  useEffect(()=>{
    if(selEvId!=null||events.length===0)return;
    try{
      const stored=localStorage.getItem("gc_selected_race");
      const num=stored?Number(stored):null;
      if(num&&events.some(e=>e.id===num))setSelEvId(num);
    }catch(e){}
  },[events]);

  // Load + subscribe to equipment_scans for the selected event
  useEffect(()=>{
    if(!selEvId)return;
    let active=true;
    (async()=>{
      const {data}=await sb.from("equipment_scans").select("*").eq("event_id",selEvId).order("created_at",{ascending:true});
      if(active)setScans(data||[]);
    })();
    const ch=sb.channel(`eq-scans-${selEvId}`)
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"equipment_scans",filter:`event_id=eq.${selEvId}`},payload=>{
        setScans(prev=>prev.some(s=>s.id===payload.new.id)?prev:[...prev,payload.new]);
      })
      .subscribe();
    return ()=>{active=false;sb.removeChannel(ch);};
  },[selEvId]);

  const addScan=async(row)=>{
    const {data,error}=await sb.from("equipment_scans").insert(row).select().single();
    if(!error&&data)setScans(prev=>prev.some(s=>s.id===data.id)?prev:[...prev,data]);
    return {data,error};
  };

  if(session===undefined||( session&&!loaded))return <div style={{padding:40,textAlign:"center",color:C.textMuted}}>{STR.loading}</div>;
  if(session===null)return <LoginGate/>;

  const me=users.find(u=>u.id===session.user.id);
  if(!me?.isAdmin&&!me?.isSubAdmin&&!me?.isOfficial){
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <Card style={{maxWidth:360,textAlign:"center"}}>
        <div style={{fontWeight:900,fontSize:18,marginBottom:8}}><span style={{color:C.red}}>GRID</span>CONTROL</div>
        <div style={{color:C.textMuted,fontSize:13}}>{STR.notOfficial}</div>
      </Card>
    </div>;
  }

  const ev=events.find(e=>e.id===selEvId);
  const isAdminUser=!!(me.isAdmin||me.isSubAdmin);
  const notAssignedToThisEvent=ev&&!isAdminUser&&(ev.scanningOfficials||[]).length>0&&!(ev.scanningOfficials||[]).includes(me.id);

  return <div style={{maxWidth:720,margin:"0 auto",minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontWeight:900,fontSize:16}}><span style={{color:C.red}}>GRID</span>CONTROL</span>
        <span style={{color:C.textDim,fontSize:12}}>· {LANG==="en"?"Equipment scanning":"Udstyrsscanning"}</span>
      </div>
      <a href="index.html" style={{color:C.textMuted,fontSize:12,textDecoration:"none"}}>{STR.backToApp}</a>
    </div>

    <div style={{padding:16,flex:1}}>
      <Sel label={STR.race} value={selEvId||""} onChange={v=>{setSelEvId(v?Number(v):null);}} options={[{value:"",label:STR.chooseRace},...events.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(e=>({value:String(e.id),label:`${e.name} (${e.date})`}))]}/>

      {ev&&notAssignedToThisEvent&&<div style={{color:C.orange,fontSize:13,padding:24,textAlign:"center",background:`${C.orange}11`,borderRadius:8,border:`1px solid ${C.orange}44`}}>{STR.notAssigned}</div>}
      {ev&&!notAssignedToThisEvent&&<>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {[["scan",STR.tabScan],["heat",STR.tabHeat],["profile",STR.tabProfile]].map(([id,label])=>
            <button key={id} onClick={()=>setMode(id)} style={{flex:1,background:mode===id?`${C.red}22`:C.surface2,border:`2px solid ${mode===id?C.red:C.border}`,borderRadius:8,padding:"8px 4px",cursor:"pointer",color:mode===id?C.red:C.textMuted,fontWeight:700,fontSize:12,fontFamily:"inherit"}}>{label}</button>
          )}
        </div>
        {mode==="scan"&&<ScanMode ev={ev} users={users} sessions={sessions} scans={scans} addScan={addScan} me={me}/>}
        {mode==="heat"&&<HeatOverview ev={ev} users={users} sessions={sessions} scans={scans}/>}
        {mode==="profile"&&<DriverProfile ev={ev} users={users} scans={scans}/>}
      </>}
      {!ev&&<div style={{color:C.textDim,fontSize:13,padding:24,textAlign:"center"}}>{STR.choosePrompt}</div>}
    </div>
  </div>;
}

function LoginGate(){
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <Card style={{maxWidth:360,textAlign:"center"}}>
      <div style={{fontWeight:900,fontSize:18,marginBottom:8}}><span style={{color:C.red}}>GRID</span>CONTROL</div>
      <div style={{color:C.textMuted,fontSize:13,marginBottom:16}}>{STR.loginRequired}</div>
      <a href="index.html" style={{display:"inline-block"}}><Btn>{STR.loginBtn}</Btn></a>
    </Card>
  </div>;
}

// ── SCAN MODE ────────────────────────────────────────────────────────────
function ScanMode({ev,users,sessions,scans,addScan,me}){
  const [sessionCtx,setSessionCtx]=useState("checkin"); // "checkin" or a heat name
  const [code,setCode]=useState("");
  const [driver,setDriver]=useState(null);
  const [err,setErr]=useState("");
  const [activePart,setActivePart]=useState(null); // frame|motor|slick|wet while awaiting a scan
  const [confirmPopup,setConfirmPopup]=useState(null); // {part,barcode,count}
  const [alarm,setAlarm]=useState(null); // {part,barcode}
  const [cameraFor,setCameraFor]=useState(null); // "license" | "part" | null – which field the camera modal feeds into
  const inputRef=useRef(null);
  const by=(JSON.parse(localStorage.getItem("gc_scan_by")||'""'))||"";
  // Auto-select the logged-in official's own name (falls back to whatever was last picked on this
  // device, then to blank). Still overridable via the dropdown below, e.g. if a device is shared.
  const [byName,setByName]=useState(me?.name||by||"");
  // Officials assigned to scanning for this race (set in Admin → Officials). Falls back to every
  // official/admin if nobody's specifically assigned, matching how the other stations work.
  const scanningOfficialNames=((ev.scanningOfficials&&ev.scanningOfficials.length)
    ?ev.scanningOfficials.map(id=>users.find(u=>u.id===id)).filter(Boolean)
    :users.filter(u=>u.isAdmin||u.isSubAdmin||u.isOfficial)
  ).map(u=>u.name).filter(Boolean).sort((a,b)=>a.localeCompare(b,"da"));

  useEffect(()=>{localStorage.setItem("gc_scan_by",JSON.stringify(byName));},[byName]);
  useEffect(()=>{if(inputRef.current)inputRef.current.focus();},[driver,activePart]);

  const driverScans=(driverId)=>scans.filter(s=>s.event_id===ev.id&&s.driver_id===driverId);
  const partBarcodes=(driverId,part)=>{
    const rows=driverScans(driverId).filter(s=>s.part_type===part&&s.status!=="violation");
    return [...new Set(rows.map(r=>r.barcode))];
  };

  const findDriver=(license)=>{
    const l=license.trim().toLowerCase();
    if(!l)return null;
    const u=users.find(x=>(x.license||"").trim().toLowerCase()===l);
    if(!u)return null;
    const reg=(ev.registrations||[]).find(r=>r.userId===u.id);
    if(!reg)return {notRegistered:true,user:u};
    return {...u,_regClass:reg.class};
  };

  const handleLicenseScan=(val)=>{
    setErr("");
    const found=findDriver(val);
    if(!found){setErr(STR.unknownLicense(val));setCode("");return;}
    if(found.notRegistered){setErr(STR.notRegistered(found.user.name));setCode("");return;}
    setDriver(found);
    setCode("");
  };

  const handlePartScan=async(part,val)=>{
    const barcode=val.trim();
    if(!barcode)return;
    setCode("");
    const known=partBarcodes(driver.id,part);
    const isKnown=known.includes(barcode);
    if(isKnown){
      await addScan({event_id:ev.id,driver_id:driver.id,driver_name:driver.name,kart_no:driver.kartNumber?String(driver.kartNumber):null,class:driver._regClass,session:sessionCtx==="checkin"?null:sessionCtx,part_type:part,barcode,status:"ok",scanned_by:byName});
      setActivePart(null);
      return;
    }
    if(part==="frame"||part==="motor"){
      // Unlimited history for frame/motor, but still confirm before adding — shows what's new
      // and how many the driver already has registered.
      setConfirmPopup({part,barcode,count:known.length});
      return;
    }
    // Tire: enforce the 5-per-type limit
    if(known.length<5){
      setConfirmPopup({part,barcode,count:known.length});
    }else{
      playAlarm();
      setAlarm({part,barcode});
    }
  };

  const confirmNewPart=async(accept)=>{
    if(accept){
      await addScan({event_id:ev.id,driver_id:driver.id,driver_name:driver.name,kart_no:driver.kartNumber?String(driver.kartNumber):null,class:driver._regClass,session:sessionCtx==="checkin"?null:sessionCtx,part_type:confirmPopup.part,barcode:confirmPopup.barcode,status:confirmPopup.count?"new_registered":"ok",scanned_by:byName});
    }
    setConfirmPopup(null);
    setActivePart(null);
  };

  const acknowledgeAlarm=async()=>{
    await addScan({event_id:ev.id,driver_id:driver.id,driver_name:driver.name,kart_no:driver.kartNumber?String(driver.kartNumber):null,class:driver._regClass,session:sessionCtx==="checkin"?null:sessionCtx,part_type:alarm.part,barcode:alarm.barcode,status:"violation",scanned_by:byName});
    setAlarm(null);
    setActivePart(null);
  };

  const onKeyDown=(handler)=>e=>{if(e.key==="Enter"){handler(e.target.value);}};

  // Active classes for this event with "scanned in" progress for the currently selected context
  // (checkin, or a specific heat/session) — a driver counts as scanned once they have at least
  // one equipment_scans row (any part) in that context. If a class has heat-split groups (A/B/C)
  // for this context, also break the progress down per group underneath it.
  const classProgress=[...new Set((ev.registrations||[]).map(r=>r.class))].filter(Boolean).sort((a,b)=>a.localeCompare(b,"da")).map(cls=>{
    const total=(ev.registrations||[]).filter(r=>r.class===cls).length;
    const scannedIds=new Set(scans.filter(s=>s.event_id===ev.id&&s.class===cls&&(sessionCtx==="checkin"?!s.session:s.session===sessionCtx)).map(s=>s.driver_id));
    const groupLetters=sessionGroupLetters(ev,cls,sessionCtx);
    const groups=groupLetters.map(g=>{
      const list=sessionDrivers(ev,cls,sessionCtx,users,[g]);
      return {g,scanned:list.filter(d=>scannedIds.has(d.id)).length,total:list.length};
    });
    return {cls,scanned:scannedIds.size,total,groups};
  });

  return <div>
    <Card>
      <Sel label={STR.yourName} value={byName} onChange={setByName} options={[{value:"",label:STR.choose},...scanningOfficialNames.map(n=>({value:n,label:n}))]}/>
      <Sel label={STR.context} value={sessionCtx} onChange={v=>{setSessionCtx(v);}} options={[{value:"checkin",label:STR.checkinLong},...sessions.map(s=>({value:s.name,label:s.name}))]}/>
    </Card>

    {!driver&&<Card>
      <div style={{color:C.textMuted,fontSize:12,marginBottom:8}}>{STR.scanLicensePrompt}</div>
      <Input inputRef={inputRef} label={STR.licenseNumber} value={code} onChange={setCode} onKeyDown={onKeyDown(handleLicenseScan)} placeholder={STR.scanOrEnterLicense} autoFocus onCamera={()=>setCameraFor("license")}/>
      {err&&<div style={{color:C.red,fontSize:12,marginTop:4}}>{err}</div>}
    </Card>}

    {driver&&<>
      <Card style={{borderLeft:`3px solid ${C.green}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>{driver.name}</div>
            <div style={{color:C.textMuted,fontSize:12}}>#{driver.kartNumber||"?"} · {driver._regClass} · {LANG==="en"?"License":"Licens"} {driver.license}</div>
          </div>
          <Btn small variant="ghost" onClick={()=>{setDriver(null);setActivePart(null);}}>{STR.switchDriver}</Btn>
        </div>
      </Card>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        {["frame","motor","slick","wet"].map(part=>{
          const known=partBarcodes(driver.id,part);
          const limit=part==="slick"||part==="wet"?5:null;
          return <Card key={part} onClick={()=>setActivePart(part)} style={{cursor:"pointer",borderLeft:`3px solid ${activePart===part?C.red:C.border}`,marginBottom:0}}>
            <div style={{fontSize:20,marginBottom:4}}>{PART_ICONS[part]}</div>
            <div style={{fontWeight:700,fontSize:13}}>{PARTS[part]}</div>
            <div style={{color:C.textMuted,fontSize:11}}>{known.length}{limit?`/${limit}`:""} {STR.registered}</div>
          </Card>;
        })}
      </div>

      {activePart&&<Card style={{borderLeft:`3px solid ${C.red}`}}>
        <div style={{color:C.text,fontWeight:700,marginBottom:8}}>{STR.scanPrefix} {PARTS[activePart].toLowerCase()}</div>
        <Input inputRef={inputRef} value={code} onChange={setCode} onKeyDown={onKeyDown(v=>handlePartScan(activePart,v))} placeholder={STR.scanOrEnterBarcode} autoFocus onCamera={()=>setCameraFor("part")}/>
        <div style={{color:C.textDim,fontSize:11}}>
          {partBarcodes(driver.id,activePart).length>0
            ?`${STR.knownCodes} ${partBarcodes(driver.id,activePart).join(", ")}`
            :STR.noneYet}
        </div>
      </Card>}
    </>}

    {classProgress.length>0&&<Card>
      <div style={{color:C.textMuted,fontSize:11,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>{STR.classProgress}</div>
      {classProgress.map(({cls,scanned,total,groups})=>{
        const pct=total?Math.min(100,Math.round(scanned/total*100)):0;
        const done=total>0&&scanned>=total;
        return <div key={cls} style={{marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}>
            <span style={{color:C.text}}>{cls}</span>
            <span style={{color:done?C.green:C.textMuted,fontWeight:700}}>{scanned}/{total}</span>
          </div>
          <div style={{height:4,background:C.surface2,borderRadius:2,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${pct}%`,background:done?C.green:C.red,borderRadius:2}}/>
          </div>
          {groups.length>0&&<div style={{display:"flex",gap:10,marginTop:5,paddingLeft:2}}>
            {groups.map(({g,scanned:gs,total:gt})=>{
              const gDone=gt>0&&gs>=gt;
              return <div key={g} style={{fontSize:11,color:gDone?C.green:C.textMuted}}>{STR.group} {g}: <strong>{gs}/{gt}</strong></div>;
            })}
          </div>}
        </div>;
      })}
    </Card>}

    {cameraFor&&<CameraScanModal
      title={cameraFor==="license"?STR.cameraLicenseTitle:STR.cameraPartTitle(PARTS[activePart].toLowerCase())}
      onClose={()=>setCameraFor(null)}
      onResult={(text)=>{
        setCameraFor(null);
        if(cameraFor==="license")handleLicenseScan(text);
        else handlePartScan(activePart,text);
      }}
    />}

    {confirmPopup&&(()=>{
      const isTire=confirmPopup.part==="slick"||confirmPopup.part==="wet";
      const existing=partBarcodes(driver.id,confirmPopup.part);
      return <div style={{position:"fixed",inset:0,background:"#000000cc",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:16}}>
        <Card style={{maxWidth:400,borderLeft:`3px solid ${C.orange}`}}>
          <div style={{fontWeight:700,fontSize:16,marginBottom:8,color:C.orange}}>{PART_ICONS[confirmPopup.part]} {STR.newFor} {PARTS[confirmPopup.part].toLowerCase()} for {driver.name}</div>
          <div style={{color:C.text,fontSize:13,marginBottom:10}}>{STR.newCode} <b>{confirmPopup.barcode}</b></div>
          <div style={{color:C.textMuted,fontSize:11,letterSpacing:1,marginBottom:4,textTransform:"uppercase"}}>{existing.length>0?`${STR.alreadyRegistered} (${existing.length}${isTire?"/5":""})`:STR.noneYet}</div>
          {existing.length>0&&<div style={{background:C.surface2,borderRadius:6,padding:"8px 10px",marginBottom:12,fontSize:12,color:C.textMuted}}>{existing.map(code=><div key={code}>{code}</div>)}</div>}
          <div style={{color:C.textMuted,fontSize:12,marginBottom:16}}>
            {isTire
              ?STR.tireConfirm(confirmPopup.count+1)
              :STR.partConfirm(PARTS[confirmPopup.part].toLowerCase(),driver.name)}
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>confirmNewPart(true)} style={{flex:1}}>{STR.confirmAdd}</Btn>
            <Btn variant="ghost" onClick={()=>confirmNewPart(false)} style={{flex:1}}>{STR.cancel}</Btn>
          </div>
        </Card>
      </div>;
    })()}

    {alarm&&<div style={{position:"fixed",inset:0,background:C.red,display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}}>
      <div style={{textAlign:"center",maxWidth:420}}>
        <div style={{fontSize:60,marginBottom:12}}>⚠️</div>
        <div style={{fontWeight:900,fontSize:26,color:"#fff",marginBottom:12,fontFamily:"'Barlow Condensed',sans-serif"}}>{STR.tooMany} {PARTS[alarm.part].toUpperCase()}</div>
        <div style={{color:"#fff",fontSize:15,marginBottom:6}}>{STR.alreadyHas5(driver.name,PARTS[alarm.part].toLowerCase())}</div>
        <div style={{color:"#fff",fontSize:13,marginBottom:24,opacity:0.9}}>{STR.codeNotApproved(alarm.barcode)}</div>
        <button onClick={acknowledgeAlarm} style={{background:"#fff",color:C.red,border:"none",borderRadius:8,padding:"14px 28px",fontSize:16,fontWeight:900,cursor:"pointer",fontFamily:"inherit"}}>{STR.confirmReject}</button>
      </div>
    </div>}
  </div>;
}

// ── HEAT OVERVIEW ────────────────────────────────────────────────────────
function HeatOverview({ev,users,sessions,scans}){
  const [selClass,setSelClass]=useState("");
  const [selSession,setSelSession]=useState("checkin");
  const [selGroups,setSelGroups]=useState([]);
  const classes=[...new Set((ev.registrations||[]).map(r=>r.class))].sort();
  const groupLetters=selClass?sessionGroupLetters(ev,selClass,selSession):[];
  // Unfiltered-by-group list, so per-group counts below can be computed regardless of which
  // group toggle(s) are currently active — the toggle only affects the detail list further down.
  const allDrivers=selClass?sessionDrivers(ev,selClass,selSession,users,[]):[];
  const drivers=selGroups.length?allDrivers.filter(d=>selGroups.includes(d._group)):allDrivers;

  const statusFor=(driverId)=>{
    const rows=scans.filter(s=>s.event_id===ev.id&&s.driver_id===driverId&&(selSession==="checkin"?!s.session:s.session===selSession));
    if(rows.length===0)return "none";
    if(rows.some(r=>r.status==="violation"))return "rejected";
    return "scanned";
  };

  const toggleGroup=g=>setSelGroups(gs=>gs.includes(g)?gs.filter(x=>x!==g):[...gs,g]);

  // Per-group scan breakdown (e.g. "Gruppe A — 8 scannet, 1 afvist, 3 mangler"), independent of
  // which group(s) are toggled on — this is what makes "how many in group A are scanned" visible
  // at a glance instead of needing to filter down to just that group first.
  const groupStats=groupLetters.map(g=>{
    const list=allDrivers.filter(d=>d._group===g);
    return{
      g,total:list.length,
      scanned:list.filter(d=>statusFor(d.id)==="scanned").length,
      rejected:list.filter(d=>statusFor(d.id)==="rejected").length,
      missing:list.filter(d=>statusFor(d.id)==="none").length,
    };
  });

  return <div>
    <Card>
      <Sel label={STR.class} value={selClass} onChange={v=>{setSelClass(v);setSelGroups([]);}} options={[{value:"",label:STR.chooseClass},...classes.map(c=>({value:c,label:c}))]}/>
      <Sel label={STR.session} value={selSession} onChange={v=>{setSelSession(v);setSelGroups([]);}} options={[{value:"checkin",label:STR.checkin},...sessions.map(s=>({value:s.name,label:s.name}))]}/>
      {groupStats.length>0&&<div style={{marginTop:10}}>
        <div style={{color:C.textMuted,fontSize:10,letterSpacing:1,marginBottom:6,textTransform:"uppercase"}}>{STR.group}</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {groupStats.map(({g,total,scanned,rejected,missing})=>{
            const on=selGroups.includes(g);
            return <button key={g} onClick={()=>toggleGroup(g)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:on?C.cyan+"22":C.surface2,border:`1px solid ${on?C.cyan:C.border}`,borderRadius:8,padding:"8px 12px",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
              <span style={{color:on?C.cyan:C.text,fontWeight:700,fontSize:13}}>{on?"✓ ":""}{STR.group} {g}</span>
              <span style={{display:"flex",gap:6,flexShrink:0}}>
                <Badge color={C.green} style={{fontSize:10}}>{scanned}/{total}</Badge>
                {rejected>0&&<Badge color={C.red} style={{fontSize:10}}>{rejected} {STR.rejected}</Badge>}
              </span>
            </button>;
          })}
        </div>
      </div>}
    </Card>

    {selClass&&<>
      <div style={{display:"flex",gap:10,marginBottom:10}}>
        <Badge color={C.green}>{drivers.filter(d=>statusFor(d.id)==="scanned").length} {STR.scanned}</Badge>
        <Badge color={C.red}>{drivers.filter(d=>statusFor(d.id)==="rejected").length} {STR.rejected}</Badge>
        <Badge color={C.textDim}>{drivers.filter(d=>statusFor(d.id)==="none").length} {STR.missing}</Badge>
      </div>
      {(()=>{
        // With no group filter active and the class actually has groups, break the list into a
        // section per group (each with its own mini-heading) instead of one flat mixed list —
        // this is the "show the groups for the heat under the class" part of the request.
        if(!selGroups.length&&groupLetters.length>0){
          return groupLetters.map(g=>{
            const list=allDrivers.filter(d=>d._group===g);
            if(list.length===0)return null;
            return <div key={g} style={{marginBottom:14}}>
              <div style={{color:C.textMuted,fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:6,textTransform:"uppercase"}}>{STR.group} {g}</div>
              {list.map(d=>{
                const st=statusFor(d.id);
                const color={scanned:C.green,rejected:C.red,none:C.textDim}[st];
                const label={scanned:STR.scannedLabel,rejected:STR.rejectedLabel,none:STR.missingLabel}[st];
                return <Card key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderLeft:`3px solid ${color}`}}>
                  <div style={{fontWeight:700,fontSize:14}}>#{d.kartNumber||"?"} {d.name}</div>
                  <Badge color={color}>{label}</Badge>
                </Card>;
              })}
            </div>;
          });
        }
        return drivers.map(d=>{
          const st=statusFor(d.id);
          const color={scanned:C.green,rejected:C.red,none:C.textDim}[st];
          const label={scanned:STR.scannedLabel,rejected:STR.rejectedLabel,none:STR.missingLabel}[st];
          return <Card key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderLeft:`3px solid ${color}`}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>#{d.kartNumber||"?"} {d.name}</div>
              <div style={{color:C.textMuted,fontSize:11}}>{d._group?`${STR.group} ${d._group}`:""}</div>
            </div>
            <Badge color={color}>{label}</Badge>
          </Card>;
        });
      })()}
      {drivers.length===0&&<div style={{color:C.textDim,fontSize:12,padding:16,textAlign:"center"}}>{STR.noDriversFound}</div>}
    </>}
  </div>;
}

// ── DRIVER PROFILE ───────────────────────────────────────────────────────
function DriverProfile({ev,users,scans}){
  const [search,setSearch]=useState("");
  const [selId,setSelId]=useState(null);
  const regIds=new Set((ev.registrations||[]).map(r=>r.userId));
  const candidates=users.filter(u=>regIds.has(u.id)&&(!search||u.name.toLowerCase().includes(search.toLowerCase())||(u.license||"").includes(search)));
  const driver=users.find(u=>u.id===selId);
  const driverScans=selId?scans.filter(s=>s.event_id===ev.id&&s.driver_id===selId).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)):[];

  if(!driver)return <Card>
    <Input label={STR.searchDriver} value={search} onChange={setSearch} placeholder={STR.search}/>
    <div style={{maxHeight:400,overflowY:"auto"}}>
      {candidates.slice(0,50).map(u=><div key={u.id} onClick={()=>setSelId(u.id)} style={{padding:"8px 4px",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
        <div style={{fontWeight:600,fontSize:13}}>#{u.kartNumber||"?"} {u.name}</div>
        <div style={{color:C.textDim,fontSize:11}}>{u.class} · {LANG==="en"?"License":"Licens"} {u.license}</div>
      </div>)}
      {candidates.length===0&&<div style={{color:C.textDim,fontSize:12,padding:16,textAlign:"center"}}>{STR.noneFound}</div>}
    </div>
  </Card>;

  return <div>
    <Card style={{borderLeft:`3px solid ${C.green}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontWeight:700,fontSize:16}}>{driver.name}</div>
          <div style={{color:C.textMuted,fontSize:12}}>#{driver.kartNumber||"?"} · {driver.class} · {LANG==="en"?"License":"Licens"} {driver.license}</div>
        </div>
        <Btn small variant="ghost" onClick={()=>setSelId(null)}>{STR.switchDriver}</Btn>
      </div>
    </Card>

    {["frame","motor","slick","wet"].map(part=>{
      const rows=driverScans.filter(s=>s.part_type===part);
      const known=[...new Set(rows.filter(r=>r.status!=="violation").map(r=>r.barcode))];
      return <Card key={part}>
        <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>{PART_ICONS[part]} {PARTS[part]} ({known.length}{part==="slick"||part==="wet"?"/5":""})</div>
        {rows.length===0&&<div style={{color:C.textDim,fontSize:12}}>{STR.nothingScannedYet}</div>}
        {rows.map(r=><div key={r.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${C.border}`,fontSize:12}}>
          <span style={{color:r.status==="violation"?C.red:C.text}}>{r.barcode}{r.status==="violation"?` ${STR.rejectedTag}`:""}{r.session?` · ${r.session}`:` · ${STR.checkin}`}</span>
          <span style={{color:C.textDim}}>{new Date(r.created_at).toLocaleString(LANG==="en"?"en-GB":"da-DK")}</span>
        </div>)}
      </Card>;
    })}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
